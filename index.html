<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203dcb"><meta name="description" content="Planning partagé de la buanderie"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%BA%3C/text%3E%3C/svg%3E"><title>Buanderie</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="app">
 <header><div class="brand"><span class="brand-icon" aria-hidden="true">◎</span><div><h1 data-i18n="brand"></h1><p data-i18n="tagline"></p></div></div><button id="apartment" class="apartment"></button></header>
 <section id="live" class="live" aria-live="polite"></section>
 <section class="schedule" id="schedule"><div class="week-nav"><div><p class="eyebrow" data-i18n="weekEyebrow"></p><h2 id="week-title"></h2></div><div class="nav-buttons"><button id="prev" data-i18n-aria="prev">‹</button><button id="today" data-i18n="today"></button><button id="next" data-i18n-aria="next">›</button></div></div>
 <div class="column-head"><span></span><div><span data-i18n="morning"></span><small>07–12</small></div><div><span data-i18n="afternoon"></span><small>12–17</small></div><div><span data-i18n="evening"></span><small>17–22</small></div></div><div id="grid"></div>
 <div class="legend"><span><i class="swatch past"></i><b data-i18n="legPast"></b></span><span><i class="swatch future"></i><b data-i18n="legFuture"></b></span><span><i class="swatch mine"></i><b data-i18n="legMine"></b></span><span><i class="swatch available"></i><b data-i18n="legFree"></b></span></div></section>
 <footer><span id="connection" role="status"></span><div class="lang" role="group" id="lang"><button data-lang="fr" lang="fr">FR</button><button data-lang="de" lang="de">DE</button><button data-lang="en" lang="en">EN</button></div></footer><p class="hint" id="hint" data-i18n="hint"></p>
 </main>
 <dialog id="identity"><form method="dialog"><div class="dialog-top"><span class="eyebrow" id="identity-eyebrow"></span><button class="close" id="identity-close" data-i18n-aria="close">×</button></div><h2 id="identity-title"></h2><p id="identity-copy"></p><div id="apartment-field"><label for="apartment-select" data-i18n="idLabel"></label><select id="apartment-select"></select></div><div id="code-field"><label for="code-input" data-i18n="pcLabel"></label><input id="code-input" type="password" autocomplete="current-password" name="building-code"><small class="field-help" data-i18n="pcHelp"></small></div><button id="save-identity" class="primary" value="save"></button><small id="identity-note" data-i18n="idNote"></small></form></dialog>
 <dialog id="detail"><div class="dialog-top"><span id="detail-date" class="eyebrow"></span><button id="close-detail" class="close" data-i18n-aria="close">×</button></div><h2 id="detail-title"></h2><p id="detail-copy"></p><div id="detail-actions"></div></dialog>
 <div id="toast" role="status" hidden></div><script src="./config.js"></script><script src="./app.js"></script>
</body></html>
